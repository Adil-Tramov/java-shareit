version: '3.8'
services:
  db:
    image: postgres:13.7-alpine
    container_name: shareit-db-postgres
    ports:
      - "6541:5432"
    environment:
      - POSTGRES_DB=shareit
      - POSTGRES_USER=shareit_user
      - POSTGRES_PASSWORD=shareit_pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shareit_user -d shareit"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shareit-network

  server:
    build: ./server
    image: server_image
    container_name: shareit-server
    ports:
      - "9090:9090"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/shareit
      - SPRING_DATASOURCE_USERNAME=shareit_user
      - SPRING_DATASOURCE_PASSWORD=shareit_pass
      - SPRING_JPA_HIBERNATE_DDL_AUTO=none
      - SPRING_SQL_INIT_MODE=always
      - SERVER_PORT=9090
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 5
    networks:
      - shareit-network

  gateway:
    build: ./gateway
    image: gateway_image
    container_name: shareit-gateway
    ports:
      - "8080:8080"
    depends_on:
      server:
        condition: service_healthy
    environment:
      - SHAREIT_SERVER_URL=http://server:9090
      - SERVER_PORT=8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 5
    networks:
      - shareit-network

networks:
  shareit-network:
    driver: bridge

volumes:
  postgres_data: